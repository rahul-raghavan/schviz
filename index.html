<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchViz - Timetable Visualizer</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">
                    <i class="fas fa-calendar-alt"></i>
                    PEP Timetable
                </h1>
                <div class="header-actions">
                    <div class="upload-compact" id="upload-compact">
                        <input type="file" id="csv-file-input" accept=".csv,.json" style="display: none;">
                        <button class="btn btn-primary btn-small" id="browse-btn">
                            <i class="fas fa-upload"></i>
                            Upload Timetable
                        </button>
                    </div>
                    <div class="file-indicator" id="file-indicator" style="display: none;">
                        <i class="fas fa-file-alt"></i>
                        <span id="file-name"></span>
                        <button class="btn-remove" id="remove-file">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <button class="btn btn-secondary btn-small" id="pdf-export-btn" style="display: none;">
                        <i class="fas fa-file-pdf"></i>
                        Save PDF
                    </button>
                    <button class="btn btn-secondary btn-small" id="bulk-pdf-export-btn" style="display: none;">
                        <i class="fas fa-file-archive"></i>
                        Download All PDFs
                    </button>
                </div>
            </div>
        </header>

        <!-- Controls -->
        <div class="controls" id="controls" style="display: none;">
            <div class="control-group">
                <label>Teacher:</label>
                <div class="multiselect" data-filter="teacher">
                    <button type="button" class="multiselect-trigger" data-filter="teacher">
                        <span class="multiselect-label">All Teachers</span>
                    </button>
                    <div class="multiselect-panel">
                        <div class="multiselect-panel-header">
                            <button type="button" class="btn-clear-filter" data-filter="teacher">Clear all</button>
                        </div>
                        <div class="checkbox-group" id="teacher-filter"></div>
                    </div>
                </div>
            </div>
            <div class="control-group">
                <label>Subject:</label>
                <div class="multiselect" data-filter="subject">
                    <button type="button" class="multiselect-trigger" data-filter="subject">
                        <span class="multiselect-label">All Subjects</span>
                    </button>
                    <div class="multiselect-panel">
                        <div class="multiselect-panel-header">
                            <button type="button" class="btn-clear-filter" data-filter="subject">Clear all</button>
                        </div>
                        <div class="checkbox-group" id="subject-filter"></div>
                    </div>
                </div>
            </div>
            <div class="control-group">
                <label>Student:</label>
                <div class="multiselect" data-filter="student">
                    <button type="button" class="multiselect-trigger" data-filter="student">
                        <span class="multiselect-label">All Students</span>
                    </button>
                    <div class="multiselect-panel">
                        <div class="multiselect-panel-header">
                            <button type="button" class="btn-clear-filter" data-filter="student">Clear all</button>
                        </div>
                        <div class="checkbox-group" id="student-filter"></div>
                    </div>
                </div>
            </div>
            <div class="control-group control-group-button">
                <button class="btn btn-secondary btn-small" id="edit-times-btn">
                    <i class="fas fa-clock"></i>
                    Edit Slot Times
                </button>
            </div>
        </div>

        <!-- Slot Times Editor -->
        <div class="slot-times-editor" id="slot-times-editor" style="display: none;">
            <div class="slot-times-content">
                <div class="slot-times-header">
                    <h3>Edit Slot Times</h3>
                    <button class="btn-close" id="close-times-editor">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="slot-times-grid" id="slot-times-grid"></div>
                <div class="slot-times-actions">
                    <button class="btn btn-primary" id="update-times-btn">
                        <i class="fas fa-sync"></i>
                        Update Times & Regenerate
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <main class="main-content">
            <div class="timetable-container">
                <div class="timetable-grid" id="timetable-grid"></div>
            </div>
        </main>

        <!-- Loading Spinner -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading timetable data...</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
